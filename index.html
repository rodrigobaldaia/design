<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/web-log.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rodrigo Prata Baldaia — UX designer crafting clear, intuitive tools for complex workflows. Currently designing audio & video software at Elgato."
    />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0a" media="(prefers-color-scheme: dark)" />
    <link
      rel="preload"
      href="/fonts/SpaceGrotesk-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Rodrigo Prata Baldaia — UX Designer</title>
    <script>
      // Apply the persisted (or system) color mode before first paint to
      // avoid a flash. Read/written by src/theme/ThemeProvider.jsx.
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(mode);
          document.documentElement.style.colorScheme = mode;
        } catch (e) {
          /* noop */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
